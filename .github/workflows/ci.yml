name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs first: `npm run build` does NOT typecheck, so tsc is the only
      # thing standing between a type error and production.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npx vite build
        env:
          # Build-time placeholders only. The real values are injected by the
          # deploy environment; these just keep the bundle from being built
          # against an undefined Supabase client.
          VITE_SUPABASE_URL: https://ci.invalid.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
